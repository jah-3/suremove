<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In Options | suremove</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .account-settings { max-width: 640px; margin: 24px auto; }
        .phone-account-help { color: #475569; line-height: 1.6; }
        .facebook-account-button { max-width: 460px; }
    </style>
</head>
<body class="portal-layout">
    <header class="main-navigation">
        <a href="login.html" class="brand-name">suremove | Sign-In Options</a>
        <nav class="top-nav-links">
            <button type="button" id="return-to-sign-in">Back to sign in</button>
        </nav>
    </header>
    <main class="main-content" style="margin-left:0;width:100%;max-width:1100px;margin-right:auto;">
        <section class="content-card account-settings">
            <h1>Manage sign-in options</h1>
            <section aria-labelledby="facebook-account-heading">
                <h2 id="facebook-account-heading">Facebook</h2>
                <p class="phone-account-help">
                    Connect Facebook to this existing SureMove account. You will be redirected to Facebook to approve the connection.
                </p>
                <p id="facebook-identity-status" class="phone-account-help" role="status" aria-live="polite"></p>
                <button type="button" id="link-facebook-identity" class="facebook-login-button facebook-account-button">
                    <span class="facebook-mark" aria-hidden="true">f</span>
                    Link Facebook account
                </button>
            </section>
            <p><button type="button" id="return-to-sign-in-bottom">Back to sign in</button></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="account-phone.js"></script>
</body>
</html>
